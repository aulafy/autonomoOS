name: PYMES workspace CI

on:
  push:
    paths:
      - "pymes/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pymes-ci.yml"
  pull_request:
    paths:
      - "pymes/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pymes-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check --workspace=@agent-world/pymes
      - name: Validate operational scripts
        run: |
          bash -n pymes/scripts/backup-volume.sh pymes/scripts/verify-backup.sh
          test -x pymes/scripts/backup-volume.sh
          test -x pymes/scripts/verify-backup.sh
      - name: Validate deployment compose file
        env:
          PYMES_API_BOOTSTRAP_TOKEN: ci-compose-validation-token
        run: docker compose -f pymes/docker-compose.yml config --quiet
      - name: Build deployment image
        run: docker build --file pymes/Dockerfile --tag pymes-workspace:ci .
      - name: Smoke test deployment image
        run: |
          docker run --detach --rm --name pymes-ci -p 8790:8790 \
            -e PYMES_API_BOOTSTRAP_TOKEN=ci-smoke-test-token \
            -e PYMES_API_BOOTSTRAP_TENANT=ci-agency \
            pymes-workspace:ci
          trap 'docker stop pymes-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8790/readyz; then exit 0; fi
            sleep 1
          done
          docker logs pymes-ci
          exit 1
