name: PYMES workspace CI

on:
  push:
    paths:
      - "pymes/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/pymes-ci.yml"
  pull_request:
    paths:
      - "pymes/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".nvmrc"
      - ".dockerignore"
      - ".github/workflows/pymes-ci.yml"

permissions:
  contents: read

concurrency:
  group: pymes-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck all workspaces
        run: npm run typecheck --workspaces --if-present
      - name: Verify lockfile remains clean
        run: git diff --exit-code -- package.json package-lock.json
      - name: Verify supported Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) throw new Error('Node 22+ required')"
      - name: Verify Node version file
        run: test "$(tr -d '[:space:]' < .nvmrc)" = "22"
      - name: Verify npm engine policy
        run: test "$(npm config get engine-strict)" = "true"
      - name: Verify release configuration surfaces
        run: |
          grep -q '^PYMES_API_VERSION=' pymes/.env.example
          grep -q 'PYMES_API_VERSION' pymes/docker-compose.yml pymes/Dockerfile pymes/DEPLOYMENT.md
          grep -q '^PYMES_API_BOOTSTRAP_TENANT=' pymes/.env.example
          grep -q '^PYMES_API_BOOTSTRAP_USER=' pymes/.env.example
          grep -q 'PYMES_OPENCLAW_INGRESS_TOKEN' pymes/.env.example pymes/docker-compose.yml pymes/DEPLOYMENT.md
          grep -q '16 caracteres' pymes/DEPLOYMENT.md
          grep -q 'whatsapp,telegram,imessage,email' pymes/.env.example pymes/docker-compose.yml
          grep -q 'iMessage' pymes/README.md
          grep -q '^PYMES_MESSAGE_GATEWAY_URL=' pymes/.env.example
          grep -q '^PYMES_CRM_GATEWAY_URL=' pymes/.env.example
          grep -q '^PYMES_CALL_GATEWAY_URL=' pymes/.env.example
          grep -q 'message-gateway-token' pymes/k8s/deployment.yaml pymes/k8s/secret.example.yaml
          grep -q 'crm-gateway-token' pymes/k8s/deployment.yaml pymes/k8s/secret.example.yaml
          grep -q 'call-gateway-token' pymes/k8s/deployment.yaml pymes/k8s/secret.example.yaml
      - name: Validate repository diff
        run: git diff --check
      - run: npm run check:pymes
      - name: Validate OpenClaw ingress contract
        run: npm run check:openclaw-contract
      - name: Validate operational scripts
        run: |
          bash -n pymes/scripts/backup-volume.sh pymes/scripts/verify-backup.sh pymes/scripts/check-operations.sh scripts/check-k8s-manifest.sh
          test -x pymes/scripts/backup-volume.sh
          test -x pymes/scripts/verify-backup.sh
          test -x pymes/scripts/check-operations.sh
          test -x scripts/check-k8s-manifest.sh
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          printf 'smoke\n' > "$tmp_dir/data.txt"
          tar czf "$tmp_dir/sample.tgz" -C "$tmp_dir" data.txt
          sha256sum "$tmp_dir/sample.tgz" > "$tmp_dir/sample.tgz.sha256"
          pymes/scripts/verify-backup.sh "$tmp_dir/sample.tgz"
          printf 'corrupt' >> "$tmp_dir/sample.tgz"
          if pymes/scripts/verify-backup.sh "$tmp_dir/sample.tgz"; then
            echo 'Corrupted backup was incorrectly accepted' >&2
            exit 1
          fi
      - name: Validate Kubernetes overlay
        run: npm run check:k8s
      - name: Validate deployment compose file
        env:
          PYMES_API_BOOTSTRAP_TOKEN: ci-compose-validation-token
        run: docker compose -f pymes/docker-compose.yml config --quiet
      - name: Build deployment image
        run: docker build --file pymes/Dockerfile --tag pymes-workspace:ci .
      - name: Smoke test deployment image
        run: |
          docker run --detach --rm --name pymes-ci -p 8790:8790 \
            -e PYMES_API_BOOTSTRAP_TOKEN=ci-smoke-test-token \
            -e PYMES_API_BOOTSTRAP_TENANT=ci-agency \
            -e PYMES_API_VERSION=ci-${{ github.run_number }} \
            pymes-workspace:ci
          trap 'docker stop pymes-ci' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8790/readyz | grep -F '"version":"ci-${{ github.run_number }}"'; then exit 0; fi
            sleep 1
          done
          docker logs pymes-ci
          exit 1
