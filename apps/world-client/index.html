<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Agent World OS</title>

  <style>
    html,
    body,
    #app {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;

      width: 510px;
      max-height:
        calc(100vh - 28px);

      overflow: auto;

      box-sizing:
        border-box;

      padding: 12px;

      border-radius: 10px;

      background:
        rgba(
          245,
          245,
          245,
          .96
        );

      box-shadow:
        0 8px 30px
        rgba(
          0,
          0,
          0,
          .25
        );
    }

    #status {
      font-weight: 800;
      margin-bottom: 8px;
    }

    .section {
      margin-top: 10px;
      padding-top: 10px;
      border-top:
        1px solid #ccc;
    }

    .section-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      opacity: .65;
      margin-bottom: 6px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 7px;
    }

    button,
    input {
      border:
        1px solid #bbb;

      border-radius: 7px;

      padding: 7px 9px;

      font: inherit;
    }

    button {
      cursor: pointer;
      background: white;
    }

    button.primary {
      background: #111;
      color: white;
      border-color: #111;
    }

    input {
      flex: 1;
      min-width: 200px;
    }

    #current,
    #plan,
    #task {
      margin-top: 8px;
      padding: 8px;

      border-radius: 7px;

      background: white;

      font-size: 12px;

      white-space:
        pre-wrap;

      word-break:
        break-word;
    }

    #plan,
    #task {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;
    }

    #timeline {
      margin-top: 10px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size: 11px;
    }

    #control-plane {
      margin-top: 8px;
      font-size: 12px;
    }

    .control-effect {
      margin: 8px 0;
      padding: 9px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      background: #fff;
    }

    .control-effect strong {
      display: block;
      margin-bottom: 4px;
    }

    .control-fact {
      margin: 3px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .control-effect[data-status="unknown"] { border-color: #d18b19; }
    .control-effect[data-status="committed"] { border-color: #16884a; }
    .control-effect[data-status="failed"] { border-color: #b53131; }

    .control-denial {
      margin: 7px 0;
      padding: 7px 9px;
      border-left: 3px solid #b53131;
      background: #fff4f4;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .event {
      display: grid;

      grid-template-columns:
        112px 1fr;

      gap: 5px;

      padding: 4px 0;

      border-bottom:
        1px solid
        rgba(
          0,
          0,
          0,
          .06
        );
    }

    .event-type {
      font-weight: 700;
    }

    .success {
      color: #14733c;
    }

    .failure {
      color: #a72a2a;
    }

    .planning {
      color: #315ea8;
    }

    .execution {
      color: #9a6700;
    }

    .muted {
      opacity: .7;
    }
  </style>
</head>

<body>
  <div id="hud">
    <div id="status">
      Connecting…
    </div>

    <div class="section">
      <div class="section-title">Durable control plane</div>
      <div class="muted">Read-only facts from the SQLite-backed runtime</div>
      <div id="control-denials" hidden></div>
      <div id="control-plane">Waiting for runtime snapshot…</div>
      <div id="control-history" hidden></div>
    </div>

    <div class="section">
      <div class="section-title">
        Natural-language Agent
      </div>

      <div class="row">
        <input
          id="goal"
          value="Go to the meeting room and say that you are ready."
        />
      </div>

      <div class="row">
        <button id="health">
          Check llama.cpp
        </button>

        <button id="plan-button">
          Ask Local Model
        </button>

        <button
          id="run-goal"
          class="primary"
        >
          Run Goal
        </button>
      </div>

      <div id="task">
        No governed task yet.
      </div>

      <div id="plan">
        No model proposal yet.
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Manual actions
      </div>

      <div class="row">
        <button id="go-room">
          Go to meeting room
        </button>

        <button id="go-home">
          Go home
        </button>
      </div>

      <div class="row">
        <input
          id="say-text"
          value="Hello. I am Astra."
        />

        <button id="say">
          Say
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        Provenance tests
      </div>

      <div class="row">
        <button id="deny">
          Test denied purchase
        </button>

        <button id="slow">
          Start revocable action
        </button>

        <button id="revoke">
          Revoke running action
        </button>
      </div>

      <div class="row">
        <button id="replay">
          Replay last 50 events
        </button>
      </div>
    </div>

    <div id="current">
      No action yet.
    </div>

    <div id="timeline">
    </div>
  </div>

  <div id="app"></div>

  <script
    type="module"
    src="/src/main.ts"
  ></script>
</body>
</html>
