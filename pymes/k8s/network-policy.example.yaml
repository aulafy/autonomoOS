apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pymes-workspace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pymes-workspace
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              pymes-client: "true"
      ports:
        - protocol: TCP
          port: 8790
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
