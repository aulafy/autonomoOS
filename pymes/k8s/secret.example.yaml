apiVersion: v1
kind: Secret
metadata:
  name: pymes-workspace-secrets
type: Opaque
stringData:
  # Sustituye estos valores con un gestor de secretos antes de aplicar.
  bootstrap-token: replace-with-a-random-token-of-at-least-16-characters
  tenant: demo-agency
  # Opcional: si se omiten, el ingress OpenClaw permanece desactivado.
  openclaw-ingress-token: ""
  openclaw-signing-secret: ""
  message-gateway-url: ""
  message-gateway-token: ""
  crm-gateway-url: ""
  crm-gateway-token: ""
  call-gateway-url: ""
  call-gateway-token: ""
