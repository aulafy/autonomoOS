services:
  pymes-workspace:
    build:
      context: ..
      dockerfile: pymes/Dockerfile
    ports:
      - "8790:8790"
    environment:
      PYMES_API_BOOTSTRAP_TOKEN: ${PYMES_API_BOOTSTRAP_TOKEN:?set a token of at least 16 characters}
      PYMES_API_BOOTSTRAP_TENANT: ${PYMES_API_BOOTSTRAP_TENANT:-demo-agency}
      PYMES_API_BOOTSTRAP_USER: ${PYMES_API_BOOTSTRAP_USER:-demo-owner}
      PYMES_API_DB_PATH: /data/pymes-workspace.db
      PYMES_API_CORS_ORIGINS: ${PYMES_API_CORS_ORIGINS:-http://127.0.0.1:5174,http://localhost:5174}
      PYMES_OPENCLAW_INGRESS_TOKEN: ${PYMES_OPENCLAW_INGRESS_TOKEN:-}
      PYMES_OPENCLAW_AGENT_IDS: ${PYMES_OPENCLAW_AGENT_IDS:-}
      PYMES_OPENCLAW_RESOURCE_IDS: ${PYMES_OPENCLAW_RESOURCE_IDS:-}
      PYMES_OPENCLAW_CHANNELS: ${PYMES_OPENCLAW_CHANNELS:-whatsapp,telegram,email}
      PYMES_OPENCLAW_PAIRED_SENDERS: ${PYMES_OPENCLAW_PAIRED_SENDERS:-}
      PYMES_OPENCLAW_CONSENTED_CONVERSATIONS: ${PYMES_OPENCLAW_CONSENTED_CONVERSATIONS:-}
    volumes:
      - pymes-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pymes-data:
